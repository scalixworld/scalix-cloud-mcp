name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalix-cloud-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, scalix-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate JSON manifests
        run: |
          python3 - <<'EOF'
          import json
          required_ok = {
              'plugin.json': lambda d: (
                  d.get('$schema') == 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json'
                  and bool(d.get('name'))
                  and isinstance(d.get('author'), dict)
                  and set(d.keys()) <= {'$schema', 'name', 'version', 'description', 'author', 'homepage', 'repository', 'license', 'keywords', 'extensions'}
              ),
              'mcp.json': lambda d: (
                  d.get('$schema') == 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json'
                  and 'mcpServers' in d
                  and d['mcpServers'].get('scalix-cloud', {}).get('type') == 'streamable-http'
                  and 'headers' not in d['mcpServers'].get('scalix-cloud', {})
              ),
              'server.json': lambda d: (
                  d.get('name') == 'world.scalix/cloud'
                  and bool(d.get('remotes'))
                  and d['remotes'][0].get('url') == 'https://api.scalix.world/v1/mcp'
                  and 'headers' not in d['remotes'][0]
              ),
              '.claude-plugin/plugin.json': lambda d: bool(d.get('name')),
              '.claude-plugin/marketplace.json': lambda d: bool(d),
              '.antigravity-plugin/plugin.json': lambda d: bool(d.get('name')),
              'lhm.plugin.json': lambda d: bool(d.get('identifier')),
              'mcp_config.json': lambda d: 'mcpServers' in d,
              '.mcp.json': lambda d: 'mcpServers' in d,
              'gemini-extension.json': lambda d: bool(d),
              'glama.json': lambda d: bool(d),
          }
          failed = []
          for path, check in required_ok.items():
              try:
                  data = json.load(open(path))
              except Exception as e:
                  failed.append(f'{path}: unparseable ({e})')
                  continue
              if not check(data):
                  failed.append(f'{path}: missing or invalid required fields')
          if failed:
              print('\n'.join(failed))
              raise SystemExit(1)
          print(f'All {len(required_ok)} manifests valid')
          EOF

      - name: Validate MCP endpoint config
        run: |
          python3 - <<'EOF'
          import json
          mcp = json.load(open('.mcp.json'))['mcpServers']['scalix']
          assert mcp['url'] == 'https://api.scalix.world/v1/mcp', f"Unexpected URL: {mcp['url']}"
          assert 'headers' not in mcp, 'OAuth 2.1 endpoint must not require static headers'
          agent_mcp = json.load(open('mcp.json'))['mcpServers']['scalix-cloud']
          assert agent_mcp['url'] == 'https://api.scalix.world/v1/mcp'
          assert agent_mcp['type'] == 'streamable-http'
          assert 'headers' not in agent_mcp
          gemini = json.load(open('gemini-extension.json'))['mcpServers']['scalix']
          assert gemini['httpUrl'] == 'https://api.scalix.world/v1/mcp'
          assert 'headers' not in gemini
          print('MCP endpoint config OK (OAuth 2.1):', mcp['url'])
          EOF

      - name: Validate skill references
        run: |
          for d in skills/*/; do
            test -f "${d}SKILL.md" || { echo "MISSING: ${d}SKILL.md"; exit 1; }
          done
          echo "All skill directories carry SKILL.md"
